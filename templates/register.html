<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1581578731522-745505146317?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .heading-style { font-family: 'Bebas Neue', cursive; font-size: 4rem; letter-spacing: 2px; color: #ff4757; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .btn-register {
            background: #ff4757;
            color: white;
            font-weight: 700;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            border: none;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-register:hover { background: #2f3542; transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card">
                <h1 class="heading-style text-center mb-0">JOIN THE HUB</h1>
                <p class="text-center text-muted mb-4 fw-bold">Kashipur ke top vendors mein shamil hon</p>
                
                <form action="/register" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <input type="text" name="name" class="form-control" placeholder="Aapka Naam" required>
                        </div>
                        <div class="col-md-6">
                            <input type="text" name="phone" class="form-control" placeholder="Mobile Number" required>
                        </div>
                    </div>

                    <input type="password" name="password" class="form-control" placeholder="Ek Mazboot Password" required>

                    <select name="role" class="form-select" onchange="toggleWorkerFields(this.value)">
                        <option value="Worker">Main Kaam Karna Chahta Hoon (Vendor)</option>
                        <option value="Customer">Mujhe Kaam Karwana Hai (User)</option>
                    </select>

                    <div id="worker-fields">
                        <select name="service" class="form-select">
                            <option value="">Aap Kya Kaam Karte Hain?</option>
                            <option value="Tuition">Home Tuition</option>
                            <option value="Safai">Ghar ki Safai</option>
                            <option value="Plumber">Plumbing</option>
                            <option value="Electrician">Electrician</option>
                        </select>
                        <input type="text" name="rate" class="form-control" placeholder="Aapka Rate (e.g. ₹500/Visit)">
                        <textarea name="bio" class="form-control" rows="3" placeholder="Apne baare mein thoda bataiye (Experience, etc.)"></textarea>
                    </div>

                    <button type="submit" class="btn-register shadow-lg mt-3">Register My Account</button>
                    
                    <div class="text-center mt-3">
                        <a href="/login" class="text-muted small text-decoration-none">Pehle se account hai? Login karein</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function toggleWorkerFields(role) {
    const fields = document.getElementById('worker-fields');
    fields.style.display = (role === 'Worker') ? 'block' : 'none';
}
</script>

</body>
</html>
