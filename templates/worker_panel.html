<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f7f6; }
        .nav-brand { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: #ff4757; }
        .dashboard-card { border-radius: 30px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .status-toggle {
            width: 150px; height: 150px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; cursor: pointer;
            transition: 0.5s; border: 8px solid white; margin: auto;
        }
        .online { background: #2ecc71; color: white; box-shadow: 0 0 25px rgba(46, 204, 113, 0.5); }
        .offline { background: #ff4757; color: white; box-shadow: 0 0 25px rgba(255, 71, 87, 0.5); }
    </style>
</head>
<body class="p-3">

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <span class="nav-brand">KASHIPUR VENDOR HUB.</span>
        <a href="/logout" class="btn btn-outline-dark btn-sm rounded-pill">Logout</a>
    </div>

    <div class="card dashboard-card p-4 text-center">
        <div class="mb-3">
            <h2 class="fw-bold mb-0">Namaste, {{ worker.name }}!</h2>
            <p class="text-muted">Expert in: <b>{{ worker.service }}</b></p>
        </div>

        <div class="my-5">
            <a href="/toggle_status" style="text-decoration: none;">
                <div class="status-toggle {{ 'online' if worker.status == 'Online' else 'offline' }}">
                    {{ worker.status }}
                </div>
            </a>
            <p class="mt-3 text-muted">Tap to change your status</p>
        </div>

        <div class="row g-3">
            <div class="col-6">
                <div class="p-3 bg-light rounded-4">
                    <small class="text-muted d-block">Aapka Rate</small>
                    <span class="fw-bold">{{ worker.rate }}</span>
                </div>
            </div>
            <div class="col-6">
                <div class="p-3 bg-light rounded-4">
                    <small class="text-muted d-block">Rating</small>
                    <span class="fw-bold text-warning">⭐ {{ worker.rating }}</span>
                </div>
            </div>
        </div>
        
        <div class="mt-4 p-3 border rounded-4 text-start">
            <small class="text-muted">Aapka Bio:</small>
            <p class="mb-0 small">{{ worker.bio }}</p>
        </div>
    </div>
</div>

</body>
</html>
