<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f1f2f6; }
        .admin-header { background: #2f3542; color: white; padding: 20px; font-family: 'Bebas Neue'; font-size: 2.5rem; }
    </style>
</head>
<body>
    <div class="admin-header text-center">KASHIPUR HUB ADMIN</div>
    <div class="container mt-4">
        <div class="table-responsive bg-white p-3 rounded-4 shadow">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Phone</th>
                        <th>Verified</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.name }}</td>
                        <td>{{ user.role }}</td>
                        <td>{{ user.phone }}</td>
                        <td>{{ "✅ Yes" if user.is_verified else "❌ No" }}</td>
                        <td>
                            <a href="/verify/{{user.id}}" class="btn btn-sm btn-dark">Toggle Verify</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a href="/logout" class="btn btn-danger mt-3">Logout</a>
    </div>
</body>
</html>
