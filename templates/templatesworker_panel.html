<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-btn { width: 150px; height: 150px; border-radius: 50%; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body class="bg-light text-center p-4">
    <div class="card p-4 shadow-sm">
        <h3>Namaste, {{ worker.name }}!</h3>
        <p class="text-muted">Aapki Service: <b>{{ worker.service }}</b></p>
        <hr>
        
        <div class="my-4">
            <a href="/toggle_status/{{ worker.id }}" 
               class="btn status-btn {{ 'btn-success' if worker.status == 'Online' else 'btn-danger' }} d-flex align-items-center justify-content-center mx-auto">
               {{ 'GO OFFLINE' if worker.status == 'Online' else 'GO ONLINE' }}
            </a>
        </div>
        
        <p>Current Status: <strong>{{ worker.status }}</strong></p>
        <p>📍 Location: {{ worker.location }} (Kashipur)</p>
    </div>
</body>
</html>
